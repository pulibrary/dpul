plugins:
  - rubocop-rspec
  - rubocop-rails

inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: disable
  DisplayCopNames: true
  TargetRubyVersion: 4.0.9
  SuggestExtensions: false
  Exclude:
    - 'db/**/*'
    - 'script/**/*'
    - 'vendor/**/*'
    - 'bin/*'
    - 'config/deploy.rb'
    - 'config/environments/**/*'
    - 'node_modules/**/*'
    - 'solr/**/*'
    - 'tmp/**/*'
    - 'log/**/*'

Layout/BlockEndNewline:
  Exclude:
    - 'spec/**/*'

Layout/FirstHashElementIndentation:
  Exclude:
    - 'app/controllers/catalog_controller.rb'

Layout/IndentationConsistency:
  EnforcedStyle: indented_internal_methods

Layout/LeadingCommentSpace:
  Exclude:
    - 'spec/**/*'

Layout/LineLength:
  Enabled: false

Layout/MultilineBlockLayout:
  Exclude:
    - 'spec/**/*'

Lint/ConstantDefinitionInBlock:
  Enabled: false

Lint/SendWithMixinArgument:
  Enabled: false

Lint/UnusedBlockArgument:
  Exclude:
    - 'spec/**/*'

Lint/UnusedMethodArgument:
  Exclude:
    - 'app/jobs/spotlight/reindex_job.rb'

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Max: 31
  Exclude:
    - 'app/controllers/catalog_controller.rb'
    - 'lib/tasks/dev.rake'
    - 'spec/**/*'
    - 'lib/tasks/**/*'
    - 'config/routes.rb'

Metrics/ClassLength:
  Exclude:
    - 'app/controllers/catalog_controller.rb'
    - 'app/services/iiif_manifest.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'app/values/manifest_metadata.rb'
    - 'app/services/iiif_manifest.rb'
    - 'app/jobs/spotlight/update_job_trackers_job.rb'

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Exclude:
    - 'spec/fixtures/iiif_responses.rb'

Naming/FileName:
  Exclude:
    - 'Capfile'
    - 'Gemfile'

Naming/MemoizedInstanceVariableName:
  Exclude:
    - 'app/controllers/exhibits_controller.rb'

Rails:
  Enabled: true

Rails/Date:
  Enabled: false

Rails/DynamicFindBy:
  Exclude:
    - 'app/controllers/exhibits_controller.rb'
    - 'app/models/exhibit_proxy.rb'
    - 'app/decorators/applies_title_from_slug.rb'
    - 'app/values/manifest_metadata.rb'

Rails/FindEach:
  Enabled: false

Rails/HelperInstanceVariable:
  Enabled: false

Rails/OutputSafety:
  Exclude:
    - 'app/processors/custom_field_rendering.rb'
    - 'app/presenters/rtl_index_presenter.rb'
    - 'app/presenters/rtl_show_presenter.rb'
    - 'spec/presenters/rtl_show_presenter_spec.rb'
    - 'app/processors/list_rendering.rb'

Rails/TimeZone:
  Enabled: false

Rails/UnknownEnv:
  Environments:
    - production
    - development
    - test
    - staging

RSpec/AnyInstance:
  Exclude:
    - 'spec/support/stub_iiif_response.rb'
    - 'spec/features/catalog_show_spec.rb'
    - 'spec/models/iiif_resource_spec.rb'

RSpec/BeEq:
  Enabled: false

RSpec/ContextWording:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - 'spec/abilities/**/*'
    - 'spec/features/**/*'
    - 'spec/views/**/*'
    - 'spec/routing/**/*'
    - 'spec/inputs/**/*'

RSpec/EmptyLineAfterExample:
  Enabled: false

RSpec/EmptyLineAfterHook:
  Enabled: false

RSpec/EmptyLineAfterSubject:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/ExampleWording:
  CustomTransform:
    be: is
    have: has
    not: does not
    NOT: does NOT
  IgnoredWords:
    - only

# RSpec/FilePath:
#   Enabled: false

RSpec/IndexedLet:
  Enabled: false

RSpec/MetadataStyle:
  Enabled: false

RSpec/MultipleExpectations:
  Exclude:
    - 'spec/features/**/*'
    - 'spec/requests/catalog_spec.rb'
    - 'spec/models/iiif_resource_spec.rb'
    - 'spec/services/date_sort_migration_spec.rb'
    - 'spec/views/**/*'

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/ReceiveMessages:
  Enabled: false

RSpec/RemoveConst:
  Enabled: false

RSpec/VerifiedDoubles:
  Exclude:
    - 'spec/jobs/spotlight/reindex_job_spec.rb'
    - 'spec/presenters/rtl_index_presenter_spec.rb'
    - 'spec/presenters/rtl_show_presenter_spec.rb'
    - 'spec/views/spotlight/**/*'

Security/Open:
  Exclude:
    - 'app/models/external_manifest.rb'

Style/BlockComments:
  Exclude:
    - 'spec/spec_helper.rb'

Style/BlockDelimiters:
  Exclude:
    - 'spec/**/*'

Style/ClassAndModuleChildren:
  Enabled: false

Style/CollectionMethods:
  PreferredMethods:
    collect: 'map'
    collect!: 'map!'
    inject: 'reduce'
    detect: 'find'
    find_all: 'select'

Style/Documentation:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

Style/SignalException:
  Enabled: false

Style/SingleLineBlockParams:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: 'double_quotes'

Style/SymbolProc:
  Exclude:
    - 'spec/factories/**/*'

Style/WordArray:
  Enabled: false
